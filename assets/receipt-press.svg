<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc">
  <title id="title">Gunabh Sharan</title>
  <desc id="desc">A technical pen drawing of a receipt printer feeding out a POS Agent ticket beside Gunabh's name.</desc>
  <defs>
    <pattern id="paper" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".45" fill="#838575"/></pattern>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(27)"><rect width="4" height="4" fill="#cccbb9"/><path d="M0 0v4" stroke="#585d4e" stroke-width=".95"/></pattern>
    <pattern id="bars" width="13" height="16" patternUnits="userSpaceOnUse"><path d="M1 0v16m3 0V0m4 0v16m4 0V0" stroke="#202619" stroke-width="1.6"/></pattern>
    <clipPath id="feed"><path d="M620 18h155v75l-117 34-38-14z"/></clipPath>
  </defs>
  <style>
    .ticket{animation:feed 5s ease-in-out infinite}
    @keyframes feed{0%,20%,100%{transform:translateY(5px)}40%,75%{transform:translateY(-3px)}}
    @media(prefers-reduced-motion:reduce){.ticket{animation:none}}
  </style>
  <rect width="900" height="274" fill="#f0eee2"/><rect width="900" height="274" fill="url(#paper)" opacity=".32"/>
  <path d="M31 23h837" stroke="#23291e" stroke-width="1.4"/>
  <g fill="#20251b">
    <text x="37" y="60" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="1.5">@gunabh25</text>
    <text x="30" y="143" font-family="Georgia,'Times New Roman',serif" font-size="91" letter-spacing="-5">Gunabh</text>
    <text x="30" y="221" font-family="Georgia,'Times New Roman',serif" font-size="91" letter-spacing="-5" font-style="italic">Sharan</text>
  </g>
  <path d="M347 207h120" stroke="#85d34d" stroke-width="9"/>
  <g stroke="#262c20" stroke-linejoin="round" stroke-linecap="round">
    <path d="M592 192l151-33 87 40-163 42z" fill="url(#hatch)" stroke="none"/>
    <path d="M577 139l145-42 91 45-4 52-149 43-80-46z" fill="#e1e0ce" stroke-width="2.5"/>
    <path d="M660 183l153-41-4 52-149 43z" fill="#c4c6b1" stroke-width="2"/>
    <path d="M578 141l82 42v54l-80-46z" fill="url(#hatch)" stroke-width="2"/>
    <path d="M577 139l17-31 135-40 66 35 18 39-153 41z" fill="#e4e4d3" stroke-width="2.5"/>
    <path d="M595 109l136-39 62 33-134 40z" fill="#f5f3e6" stroke-width="1.6"/>
    <path d="M614 108l110-32 12 6-112 32z" fill="#24291f"/>
    <g clip-path="url(#feed)"><g class="ticket">
      <path d="M627 118q9-13 4-33l-12-36 8-1 4-4 7 1 5-5 7 1 4-4 8 1 6-5 7 1 5-5 7 1 5-4 8 1 6-5 7 2 5-4q15 40 16 61l-2 9z" fill="#faf9ee" stroke-width="1.7"/>
      <g transform="matrix(.99 -.29 .26 .97 634 58)" stroke="none" fill="#292e24">
        <text x="0" y="2" font-family="Menlo,monospace" font-size="11" font-weight="bold">POS AGENT</text>
        <path d="M0 9h77m-77 5h42" stroke="#444b3a" stroke-width="1"/>
        <rect y="21" width="69" height="15" fill="url(#bars)"/>
      </g>
    </g></g>
    <path d="M660 177l146-39M671 204l122-35" fill="none" stroke-width="1"/>
    <path d="M758 147l13-4 10 5-13 4z" fill="#87d34e"/>
    <g transform="matrix(1 -.28 0 1 685 203)" stroke-width="2"><path d="M0 2v9m5-9v9m5-9v9m5-9v9m5-9v9m5-9v9m5-9v9m5-9v9m5-9v9"/></g>
    <path d="M583 194q-11 4-24-2c-22-10-42-8-45 0s10 15 18 10c8-6-11-15-25-10l-17 7" fill="none" stroke-width="2.2"/>
  </g>
  <path d="M31 251h837" stroke="#23291e" stroke-width="1.4"/>
</svg>
